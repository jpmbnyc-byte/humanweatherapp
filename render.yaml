services:
  # Human Weather — Node web service (existing)
  - type: web
    name: humanweather
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    buildFilter:
      ignoredPaths:
        - tally-ctrl/**
        - docs/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_PURCHASE_URL
        value: https://buy.stripe.com/5kQ28r28T8OY9s56G34ow00
      - key: VITE_PURCHASE_PRICE
        value: "60"
      - key: VITE_PURCHASE_PRICE_LABEL
        value: Annual access · no monthly plan
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ANNUAL_AMOUNT_CENTS
        value: "6000"

  # Tally CTRL — static free-tool surface (Estimator + VIN Preview)
  # Custom domain: preview.tallyctrl.com (see tally-ctrl/docs/DEPLOY_RENDER.md)
  - type: web
    name: tally-ctrl-preview
    runtime: static
    plan: free
    branch: main
    rootDir: tally-ctrl
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - tally-ctrl/**
        - render.yaml
    routes:
      # SPA client routes: /estimate, /p/:token
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional — franchise seeding via Gemini (leave unset to use curated library only)
      - key: VITE_GEMINI_API_KEY
        sync: false
      - key: VITE_GEMINI_MODEL
        value: gemini-2.0-flash
